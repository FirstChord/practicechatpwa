# Auto-deploy to Firebase Hosting on push to main branch

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Gates the deploy. Without this the module-integrity guards only run if
      # someone remembers to run them locally — and the bug they exist to catch
      # is one that passes `node --check` and looks fine in review.
      - name: Run tests
        run: npm test

      # What the screens do, in a real browser against a fake dashboard and a
      # fake microphone. Only Playwright is installed (package-lock.json is
      # not committed, and the other dev tools are not needed here).
      - name: Install browser for tests
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICE_CHAT_PWA }}
        run: firebase deploy --only hosting --token "$FIREBASE_TOKEN" --project practice-chat-pwa
